name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Собрать расширение (его zip кладём на сайт)
        run: |
          npm run build:ext
          node scripts/check-extension.mjs
          cd dist-extension && zip -r ../speacher-extension.zip . -x '*.map'

      - name: Собрать веб-версию
        env:
          # Для https://<user>.github.io/Speacher/ нужен подпуть.
          BASE_PATH: /Speacher/
        run: |
          npm run build
          cp speacher-extension.zip dist/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
